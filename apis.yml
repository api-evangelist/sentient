name: Sentient
description: >-
  Sentient (Sentient Labs / Sentient Foundation) is an open-source AI research
  lab and crypto protocol building Open, Monetizable, and Loyal (OML) artificial
  general intelligence. Its work spans agent frameworks (ROMA recursive
  meta-agent, Open Deep Search, EvoSkill agent-skill synthesis), the OML 1.0
  model-fingerprinting system for verifiable model ownership and monetization,
  and the GRID protocol with Sentient Chat as a universal interface for
  discovering, composing, and coordinating AI artifacts. Backed by Pantera
  Capital, Sentient publishes peer-reviewed research (NeurIPS, ICML, COLM) and
  ships its tooling as open-source repositories on GitHub and models on Hugging
  Face rather than as a hosted commercial REST API.
